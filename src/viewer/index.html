<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dungeon layout helper</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>dungeon layout helper</h1>
      <div class="controls">
        <label class="file">load json<input id="file" type="file" accept=".json,application/json" /></label>
        <label>layout seed<input id="seed" type="text" inputmode="numeric" autocomplete="off" disabled /></label>
        <button id="reroll" disabled>reroll</button>
        <label><input id="corridors" type="checkbox" checked disabled />corridors</label>
        <button id="export" class="primary" disabled>export svg</button>
      </div>
    </header>
    <p id="status">load a generator json (schema 2), or drop it on the page</p>
    <main id="map"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
